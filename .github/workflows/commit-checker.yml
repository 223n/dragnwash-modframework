name: Commit checker

# The history of this repository is written in one voice: a commit message
# names the people who decided what the commit should say, not the editor, the
# assistant or the IDE that typed it. A human co-author is welcome; a tool's
# attribution is not, and this check refuses it before it can reach main.
#
# It looks only at the commits a push or a pull request brings, never at the
# whole history. A range it cannot resolve - a brand-new branch, or a push that
# followed a rewrite - is reported and passed, not failed.
#
# A second job asks GitHub whether every commit's author is a GitHub account,
# and fails when one is not (see authors below).
#
# A failure's reason is an annotation on the run, and it says how to fix it.
# The same check runs locally:
#   python tools/check-commits.py
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      # The whole history: the check walks from the base to the head.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The same image the other checks run in (docs/DOCKER.md), so the Python
      # here is the Python a maintainer runs this check with.
      # The image is this repository's package, so a pull needs a sign-in. It is
      # allowed to fail: a pull request from a fork has no reach into it, and
      # docker/ci-image.sh then builds the image from the Dockerfile instead.
      - name: Sign in to the container registry
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The checks' image
        id: image
        run: echo "tag=$(docker/ci-image.sh)" >> "$GITHUB_OUTPUT"
      - name: No tool's attribution in the commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm -v "$PWD":/work -w /work -e BASE -e HEAD \
            "${{ steps.image.outputs.tag }}" python tools/check-commits.py "$BASE" "$HEAD"

  # Every commit has to belong to a GitHub account, so the history can credit
  # the person who wrote it: GitHub links a commit through its author's email,
  # and an email that is on nobody's account leaves the commit nameless. This
  # asks GitHub itself, so nothing from the pull request is checked out or run.
  authors:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Every commit's author is a GitHub account
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            let commits;
            if (context.eventName === 'pull_request') {
              commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: context.payload.pull_request.number, per_page: 100,
              });
            } else {
              const before = context.payload.before;
              if (!before || /^0+$/.test(before)) {
                core.info('A new branch: no range to look at.');
                return;
              }
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${before}...${context.sha}`,
                });
                commits = cmp.data.commits;
              } catch (e) {
                core.info(`Could not compare ${before}...${context.sha} (${e.message}); passing.`);
                return;
              }
            }
            const nameless = commits.filter(c => !c.author);
            if (nameless.length === 0) {
              core.info(`${commits.length} commit(s), every author is a GitHub account.`);
              return;
            }
            for (const c of nameless) {
              const a = c.commit.author;
              core.error(`${c.sha.slice(0, 7)} "${c.commit.message.split('\n')[0]}": the author email ${a.email} is not on any GitHub account.`,
                { title: 'Commit author not linked to GitHub' });
            }
            core.setFailed(
              `${nameless.length} of ${commits.length} commit(s) have an author email that is not on any GitHub account, so GitHub cannot say who wrote them. ` +
              'Either add that email to your account (github.com/settings/emails) and re-run this check, ' +
              'or set your GitHub no-reply email (shown on the same page) with `git config user.email <address>`, ' +
              'redo the commits with `git rebase -i --exec "git commit --amend --no-edit --reset-author" <base>`, and push again.');
